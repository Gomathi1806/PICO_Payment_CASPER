<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pico">
  <rect width="512" height="512" rx="116" fill="#ff473d"/>
  <!-- stem of the p: flat top at x-height, round-capped descender -->
  <rect x="129" y="121" width="58" height="240" fill="#fff"/>
  <circle cx="158" cy="361" r="29" fill="#fff"/>
  <!-- bowl: white disc with the counter punched back to the accent -->
  <circle cx="227" cy="207" r="84" fill="#fff"/>
  <circle cx="227" cy="207" r="36" fill="#ff473d"/>
  <!-- the period from the "Pico." wordmark -->
  <circle cx="353" cy="261" r="30" fill="#fff"/>
</svg>
